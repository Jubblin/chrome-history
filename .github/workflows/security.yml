name: Security

# Which jobs run is decided by the "changes" job (see .github/scripts/changes.sh
# and CONTRIBUTING.md): Go jobs for Go or shared changes, the extension job for
# extension or shared changes, nothing for docs-only changes. Jobs are skipped
# with job-level conditions, never workflow-level path filters, so the
# "security-ok" check always reports and can be required.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.detect.outputs.go }}
      extension: ${{ steps.detect.outputs.extension }}
      javascript: ${{ steps.detect.outputs.javascript }}
      codeql: ${{ steps.detect.outputs.codeql }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the diff against the base or previous tip works.
          fetch-depth: 0
          persist-credentials: false
      - name: Test the path classifier
        run: |
          shellcheck .github/scripts/*.sh
          sh .github/scripts/changes_test.sh
      - name: Decide what to run
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: sh .github/scripts/detect.sh

  govulncheck:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: govulncheck
        # Pinned to a commit (v1.1.4, the latest tag, panics on current Go:
        # its golang.org/x/tools cannot build SSA for the newest stdlib).
        # Bump together with the Go toolchain.
        run: go run golang.org/x/vuln/cmd/govulncheck@e672cbe8fbc8c76e28fcb6db0efd9ce354e0dac5 ./...

  codeql:
    needs: changes
    if: needs.changes.outputs.codeql != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.changes.outputs.codeql) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
          cache: true
      - uses: github/codeql-action/init@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
      - uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          category: "/language:${{ matrix.language }}"

  security-ok:
    if: always()
    needs: [changes, govulncheck, codeql]
    runs-on: ubuntu-latest
    steps:
      - name: Require every needed job to have passed or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case $r in
              success | skipped) ;;
              *) echo "::error::a required job finished as '$r'"; exit 1 ;;
            esac
          done
