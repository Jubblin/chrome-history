name: CI

# Which jobs run is decided by the "changes" job (see .github/scripts/changes.sh
# and CONTRIBUTING.md): Go jobs for Go or shared changes, the extension job for
# extension or shared changes, nothing for docs-only changes. Jobs are skipped
# with job-level conditions, never workflow-level path filters, so the
# "ci-ok" check always reports and can be required.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.detect.outputs.go }}
      extension: ${{ steps.detect.outputs.extension }}
      javascript: ${{ steps.detect.outputs.javascript }}
      codeql: ${{ steps.detect.outputs.codeql }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the diff against the base or previous tip works.
          fetch-depth: 0
          persist-credentials: false
      - name: Test the path classifier
        run: |
          shellcheck .github/scripts/*.sh
          sh .github/scripts/changes_test.sh
      - name: Decide what to run
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: sh .github/scripts/detect.sh

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "These files need gofmt:"
            echo "$out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go mod tidy leaves no diff
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  test:
    needs: [changes, lint]
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable]
        include:
          # Proves the oldest supported Go release still builds and tests.
          # go.mod's go directive (1.26.0) is the real minimum, and its
          # toolchain line names the newer release used for development, so
          # this job pins GOTOOLCHAIN=local to stop the toolchain line from
          # silently switching it to the newer release. Older toolchains
          # cannot run -race binaries on current macOS, so the oldest is only
          # checked on Linux. Bump together with go.mod when Go 1.26 goes EOL.
          - os: ubuntu-latest
            go: "1.26"
            toolchain: local
    name: test (${{ matrix.os }}, ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Never switch toolchains (the job must run the Go it names)
        if: matrix.toolchain == 'local'
        run: echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
      - name: Build (CGO off)
        run: go build ./...
        env:
          CGO_ENABLED: "0"
      - name: Test with the race detector
        if: runner.os != 'Windows'
        run: go test -race -count=1 ./...
      - name: Test (race detector needs cgo, skipped on Windows)
        if: runner.os == 'Windows'
        run: go test -count=1 ./...
        env:
          CGO_ENABLED: "0"

  cross-build:
    needs: [changes, lint]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w" -o /dev/null ./cmd/history-timeline
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

  extension:
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Extension tests
        run: make extension-test
      - name: Extension rules are in sync with internal/classify/rules.json
        run: make extension-check
      - name: Shared UI helpers are in sync with shared/ui-common.js
        run: make ui-check
      - name: Build the zip twice and require identical bytes
        run: |
          set -euo pipefail
          make extension-zip
          first="$(sha256sum dist/history-timeline-extension_v*.zip)"
          make extension-zip
          second="$(sha256sum dist/history-timeline-extension_v*.zip)"
          [ "$first" = "$second" ] || { echo "::error::zip build is not reproducible"; exit 1; }
          cd dist && sha256sum -- history-timeline-extension_v*.zip | tee SHA256SUMS-extension
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-zip
          path: |
            dist/history-timeline-extension_v*.zip
            dist/SHA256SUMS-extension
          if-no-files-found: error

  # One stable check name to require in branch protection. Skipped jobs pass;
  # failed or cancelled ones fail it.
  ci-ok:
    if: always()
    needs: [changes, lint, test, cross-build, extension]
    runs-on: ubuntu-latest
    steps:
      - name: Require every needed job to have passed or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case $r in
              success | skipped) ;;
              *) echo "::error::a required job finished as '$r'"; exit 1 ;;
            esac
          done
