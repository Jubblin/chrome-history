name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "These files need gofmt:"
            echo "$out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go mod tidy leaves no diff
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable]
        include:
          # Proves the minimum Go version in go.mod still builds and tests.
          # Older toolchains cannot run -race binaries on current macOS, so
          # the minimum is only checked on Linux.
          - os: ubuntu-latest
            go: oldest
            gofile: go.mod
    name: test (${{ matrix.os }}, ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Exactly one of the two inputs is set: oldest uses go.mod, the
          # others use the go-version from the matrix.
          go-version: ${{ matrix.gofile == '' && matrix.go || '' }}
          go-version-file: ${{ matrix.gofile }}
          cache: true
      - name: Build (CGO off)
        run: go build ./...
        env:
          CGO_ENABLED: "0"
      - name: Test with the race detector
        if: runner.os != 'Windows'
        run: go test -race -count=1 ./...
      - name: Test (race detector needs cgo, skipped on Windows)
        if: runner.os == 'Windows'
        run: go test -count=1 ./...
        env:
          CGO_ENABLED: "0"

  cross-build:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w" -o /dev/null ./cmd/chrome-history
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Extension tests
        run: make extension-test
      - name: Extension rules are in sync with internal/classify/rules.json
        run: make extension-check
      - name: Build the zip twice and require identical bytes
        run: |
          set -euo pipefail
          make extension-zip
          first="$(sha256sum dist/chrome-history-extension_v*.zip)"
          make extension-zip
          second="$(sha256sum dist/chrome-history-extension_v*.zip)"
          [ "$first" = "$second" ] || { echo "::error::zip build is not reproducible"; exit 1; }
          cd dist && sha256sum -- chrome-history-extension_v*.zip | tee SHA256SUMS-extension
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-zip
          path: |
            dist/chrome-history-extension_v*.zip
            dist/SHA256SUMS-extension
          if-no-files-found: error
